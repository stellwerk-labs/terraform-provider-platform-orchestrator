# Terraform Provider testing workflow.
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.2
  GOWORK: 'off'
  GOENV: 'off'
  GOFLAGS: ''
  GOEXPERIMENT: ''

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Terraform Provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Test release channel and metadata validation
        run: go test -v ./scripts
      - name: Install checksum-verified content scanner
        run: |
          ./scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          source scripts/release-tools.sh
          docker pull "$syft_image"
      - name: Verify release notice collection and fail-closed boundaries
        run: |
          go test -count=1 -v ./scripts/licensecollector
          ./scripts/collect-licenses.sh "$RUNNER_TEMP/provider-notices"
      - name: Test release content and qualification boundaries
        run: |
          python3 scripts/release_content_test.py
          python3 scripts/qualify_release_test.py
          python3 scripts/registry_release_test.py
      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          install-only: true
      - name: Validate release configuration without publishing
        run: goreleaser check
      - name: Exercise pinned Registry checksum and dual-signature pipeline
        run: python3 scripts/registry-release-pipeline_test.py
      - name: Run linters
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11.4

  generate:
    name: Generate Documentation and Clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - run: make check-api-specs
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: acceptance-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.4.*
          terraform_wrapper: false
      - run: go mod download
      - name: Run contained provider acceptance tests
        run: TF_ACC=1 go test -v -run '^TestAcc(AutomationResourcesLocal|ModuleVersionContractPlanLocal|ProgressiveRolloutsLocal|ProgressiveRolloutsAvailabilityLocal|ProgressiveRolloutImportLocal|DeploymentQueueLocal|PluginEnablementLocal)$' -count=1 ./internal/provider/
      - env:
          PO_ORG_ID: ${{ vars.PO_ORG_ID }}
          PO_AUTH_TOKEN: ${{ secrets.PO_AUTH_TOKEN }}
        run: |
          if [ -z "${PO_ORG_ID}" ] || [ -z "${PO_AUTH_TOKEN}" ]; then
            echo "Skipping acceptance tests because PO_ORG_ID or PO_AUTH_TOKEN is not configured."
            exit 0
          fi
          TF_ACC=1 go test -v -cover ./internal/provider/
        timeout-minutes: 10
