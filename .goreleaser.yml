# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
before:
  hooks:
    # this is just an example and not a requirement for provider building/publishing
    - go mod tidy
    - ./scripts/collect-licenses.sh --replace-generated licenses
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- id: provider-archives
  formats:
    - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  builds_info:
    owner: root
    group: root
    mtime: '{{ .CommitDate }}'
  files:
    - src: LICENSE
      info: &archive_info
        owner: root
        group: root
        mode: 0644
        mtime: '{{ .CommitDate }}'
    - src: README.md
      info: *archive_info
    - src: licenses/**/*
      info: *archive_info
    - src: licenses/modules.json
      info: *archive_info
    - src: licenses/notices.sha256.json
      info: *archive_info
checksum:
  ids: [provider-archives]
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
sboms:
  - id: qualified-release
    artifacts: any
    documents: ["*.spdx.json"]
    cmd: qualify-release-content.sh
    args: []
    env:
      - GOTOOLCHAIN=go1.26.2
      - GOWORK=off
      - GOENV=off
      - QUALIFY_SOURCE_SHA={{ .FullCommit }}
      - QUALIFY_VERSION={{ .Version }}
      - QUALIFY_TAG={{ .Tag }}
      - QUALIFY_REPOSITORY={{ .Env.GITHUB_REPOSITORY }}
      - QUALIFY_WORKFLOW_REF={{ .Env.GITHUB_WORKFLOW_REF }}
      - QUALIFY_WORKFLOW_SHA={{ .Env.GITHUB_WORKFLOW_SHA }}
      - QUALIFY_RUN_ID={{ .Env.GITHUB_RUN_ID }}
      - QUALIFY_RUN_ATTEMPT={{ .Env.GITHUB_RUN_ATTEMPT }}

signs:
  - cmd: ./scripts/sign-qualified-artifact.py
    artifacts: checksum
    args:
      - gpg
      - '{{ .FullCommit }}'
      - '{{ .Tag }}'
      - '{{ .Version }}'
      - "${artifact}"
      - "${signature}"
      - "{{ .Env.GPG_FINGERPRINT }}"
release:
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
    - glob: 'dist/*.provenance.json'
    - glob: 'dist/release-content.json'
    - glob: 'dist/release-content.json.sig'
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
